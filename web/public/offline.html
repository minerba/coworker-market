<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fffaf3" />
  <title>우리끼리 - 오프라인</title>
  <style>
    html,body{margin:0;height:100%;background:#fffaf3;color:#3b2f27;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center}
    h1{font-size:20px;margin:0}
    p{margin:0;color:#8c7b6c;font-size:15px;line-height:1.5}
    button{margin-top:16px;border:0;border-radius:16px;background:#f08a4b;color:#fff;font-size:16px;font-weight:700;padding:14px 28px}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" width="72" height="72" alt="" style="border-radius:18px" />
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
